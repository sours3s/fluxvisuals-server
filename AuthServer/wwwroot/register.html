<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Регистрация — FluxVisuals</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="bg"><div class="blob blob-1"></div><div class="blob blob-2"></div></div>

<nav class="nav">
  <div class="nav-logo"><span class="ic">F</span> FLUX<span style="background:linear-gradient(90deg,#a855f7,#ec4899);-webkit-background-clip:text;background-clip:text;color:transparent;">VISUALS</span></div>
  <div class="nav-links"><a href="/">На главную</a></div>
</nav>

<div class="auth-card">
  <h2>Регистрация</h2>
  <div class="sub">Создай аккаунт, чтобы купить доступ и скачать клиент</div>
  <div class="err" id="err"></div>
  <form id="regForm">
    <div class="field">
      <label>Логин (от 3 символов)</label>
      <input type="text" id="username" minlength="3" maxlength="50" autocomplete="username" required>
    </div>
    <div class="field">
      <label>Пароль (минимум 6 символов)</label>
      <input type="password" id="password" minlength="6" autocomplete="new-password" required>
    </div>
    <div class="field">
      <label>Повтори пароль</label>
      <input type="password" id="password2" minlength="6" autocomplete="new-password" required>
    </div>
    <button class="btn btn-primary btn-block btn-lg" type="submit" id="btn">Создать аккаунт</button>
  </form>
  <div class="form-foot">Уже есть аккаунт? <a href="/login.html">Войти</a></div>
</div>

<script src="/js/site.js"></script>
<script>
  const errBox = document.getElementById('err');
  document.getElementById('regForm').addEventListener('submit', async e => {
    e.preventDefault();
    errBox.style.display = 'none';
    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value;
    const password2 = document.getElementById('password2').value;

    if (password !== password2) {
      errBox.textContent = 'Пароли не совпадают';
      errBox.style.display = 'block';
      return;
    }

    const btn = document.getElementById('btn');
    btn.disabled = true; btn.textContent = 'Создаю…';
    try {
      const { res, data } = await apiJson('/auth/register', {
        method: 'POST',
        body: JSON.stringify({ username, password })
      });
      if (res.ok) {
        // Сразу входим
        const l = await apiJson('/auth/login', {
          method: 'POST',
          body: JSON.stringify({ username, password })
        });
        if (l.res.ok && l.data.token) { saveToken(l.data.token); location.href = '/account.html'; return; }
        location.href = '/login.html';
        return;
      }
      errBox.textContent = data?.error || 'Не удалось зарегистрироваться';
      errBox.style.display = 'block';
    } catch (err) {
      errBox.textContent = 'Сервер недоступен. Попробуй ещё раз.';
      errBox.style.display = 'block';
    }
    btn.disabled = false; btn.textContent = 'Создать аккаунт';
  });
</script>
</body>
</html>
